name: tessivo_desktop
description: Tessivo desktop app — analyze, summarize, document and report with self-hosted models.
publish_to: none
version: 0.1.0

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.47.0"

# Dependency policy (docs/adr/0003): official SDK packages only unless building
# it ourselves makes no sense. material_ui is Flutter's Material library, which
# moved out of the framework in Flutter 3.47. State uses ChangeNotifier (SDK).
dependencies:
  flutter:
    sdk: flutter
  flutter_svg: 2.3.2
  material_ui: ^1.11.0
  tray_manager: 0.9.1
  window_manager: 0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/tray/
    - assets/icons/carbon/
  # IBM Plex (SIL Open Font License 1.1, assets/fonts/OFL.txt), the design system's type.
  fonts:
    - family: IBMPlexSans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
