name: release

# Downloadable builds. Every push to main (and a manual run) keeps them as
# workflow artifacts for 30 days; a version tag (v1.2.3) publishes a GitHub
# Release with the archives and SHA256SUMS. Packaging is tools/release (Go).
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('dev-{0}', github.sha) }}

jobs:
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      # cgo off: every OS and architecture cross-compiles from one runner.
      - run: go run ./tools/release cli -version "$VERSION" -out dist
      - uses: actions/upload-artifact@v4
        with:
          name: tess-cli
          path: dist/*
          retention-days: 30

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, platform: linux, arch: amd64 }
          - { os: windows-latest, platform: windows, arch: amd64 }
          - { os: macos-latest, platform: macos, arch: arm64 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Linux desktop toolchain
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - name: Build the desktop app
        working-directory: desktop
        run: |
          flutter pub get --enforce-lockfile
          flutter build ${{ matrix.platform }} --release
      - name: Package with tess beside the app
        run: >-
          go run ./tools/release desktop -version "$VERSION"
          -platform ${{ matrix.platform }} -arch ${{ matrix.arch }} -out dist
      - uses: actions/upload-artifact@v4
        with:
          name: tessivo-desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/*
          retention-days: 30

  publish:
    if: github.ref_type == 'tag'
    needs: [cli, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: go run ./tools/release sums -dir dist
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$VERSION" dist/* --title "Tessivo $VERSION" --generate-notes --verify-tag
