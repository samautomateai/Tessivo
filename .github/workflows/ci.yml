name: ci

on:
  push:
    branches: [main, "m*-**", "feat/**", "fix/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Module checksums
        run: go mod verify
      - name: Lengths
        run: go run ./tools/lencheck -max-line 120 -max-file 500 -max-test-file 800 .
      - name: Tidy
        # go.sum only exists once the module has dependencies.
        run: |
          go mod tidy
          if [ -n "$(git status --porcelain -- go.mod go.sum)" ]; then
            git --no-pager diff -- go.mod go.sum; echo "run: go mod tidy"; exit 1
          fi
      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
      - name: Format check (gofmt -s, gofumpt, goimports)
        run: |
          diff=$(golangci-lint fmt --diff ./...)
          if [ -n "$diff" ]; then echo "$diff"; echo "run: task fmt"; exit 1; fi
      - name: Test with race detector
        run: go test -race -count=1 ./...
      - name: Coverage gate (80%)
        run: |
          go test -count=1 -covermode=atomic -coverprofile=coverage.out ./...
          go run ./tools/covercheck -profile coverage.out -min 80
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Build
        run: go build -trimpath ./...
      - name: Fuzz (smoke, 10s per target)
        run: |
          for f in $(grep -rhoE "^func Fuzz[A-Za-z0-9_]+" --include='*_test.go' . | sed 's/^func //'); do
            dir=$(dirname "$(grep -rl "^func $f(" --include='*_test.go' . | head -1)")
            go test -run '^$' -fuzz "^$f\$" -fuzztime 10s "./$dir"
          done

  gosec:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gosec
        run: go run github.com/securego/gosec/v2/cmd/gosec@latest -no-fail -fmt sarif -out gosec.sarif ./...
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gosec.sarif

  desktop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format check (prints the patch to apply when it fails)
        run: |
          dart format lib test
          if ! git diff --quiet -- .; then
            git --no-pager diff -- .; echo "run: task fmt (dart format)"; exit 1
          fi
      - run: flutter analyze --fatal-infos
      - run: flutter test --coverage
      - name: Coverage gate (80%)
        run: |
          total=$(awk -F: '/^LF:/{t+=$2} /^LH:/{h+=$2}
            END{if(t==0)print 100; else printf "%.1f", h*100/t}' coverage/lcov.info)
          echo "desktop coverage: ${total}%"
          awk -v t="$total" 'BEGIN{exit (t+0 < 80)}'
