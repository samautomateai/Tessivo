version: "3"

vars:
  BIN: bin
  COVER_MIN: 80
  COVER_PROFILE: coverage.out

tasks:
  default:
    desc: List tasks
    cmds:
      - task --list

  build:
    desc: Build the tess CLI
    cmds:
      - go build -trimpath -o {{.BIN}}/tess ./cmd/tess

  fmt:
    desc: Format Go and Dart code
    cmds:
      - gofmt -s -w .
      - cmd: dart format desktop
        ignore_error: true

  test:
    desc: Run Go tests with the race detector
    cmds:
      - go test -race -count=1 ./...

  cover:
    desc: Run tests with coverage and enforce the {{.COVER_MIN}}% gate
    cmds:
      - go test -count=1 -covermode=atomic -coverprofile={{.COVER_PROFILE}} ./...
      - go run ./tools/covercheck -profile {{.COVER_PROFILE}} -min {{.COVER_MIN}}

  lint:
    desc: Run golangci-lint (includes gosec, lll, funlen, gocyclo)
    cmds:
      - golangci-lint run ./...

  lengths:
    desc: Enforce max line length (120) and file length (500, tests 800)
    cmds:
      - go run ./tools/lencheck -max-line 120 -max-file 500 -max-test-file 800 .

  vuln:
    desc: Scan dependencies and stdlib for known vulnerabilities
    cmds:
      - go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  sec:
    desc: Run gosec standalone with SARIF output
    cmds:
      - go run github.com/securego/gosec/v2/cmd/gosec@latest -quiet -fmt sarif -out gosec.sarif ./...

  tidy:
    desc: Check go.mod and go.sum are tidy
    cmds:
      - go mod tidy
      - git diff --exit-code go.mod go.sum

  proto:
    desc: Generate Go and Dart code from the gRPC contract (needs buf)
    dir: api
    cmds:
      - buf lint
      - buf generate

  desktop:init:
    desc: Generate Flutter platform runners (macOS, Windows, Linux) once
    dir: desktop
    cmds:
      - flutter create --platforms=macos,windows,linux --org dev.tessivo --project-name tessivo_desktop .

  desktop:check:
    desc: Analyze, format-check and test the Flutter app with coverage
    dir: desktop
    cmds:
      - flutter pub get
      - dart format --output=none --set-exit-if-changed lib test
      - flutter analyze --fatal-infos
      - flutter test --coverage

  desktop:run:
    desc: Run the desktop app
    dir: desktop
    cmds:
      - flutter run -d {{OS}}

  check:
    desc: Every quality gate (run before pushing)
    cmds:
      - task: lengths
      - task: lint
      - task: cover
      - task: vuln
